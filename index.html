<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>🎯 Darts Score</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:13px;background:#202b39;color:#fff;padding:12px;touch-action:manipulation}.app{max-width:900px;margin:auto;padding:12px 12px 28px}.head{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}.title{font-size:21px;font-weight:850}.muted{color:#98a5b4;font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button.active{outline:2px solid #61d7ff;background:#193342}.card{background:#141c26;border:1px solid #2a3745;border-radius:18px;padding:14px;margin-bottom:10px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.player{background:#0f151d;border:1px solid #2a3745;border-radius:16px;padding:12px}.player.active{border-color:#61d7ff}.name{font-weight:800}.score{font-size:52px;font-weight:900;line-height:1.05;margin:5px 0}.stats{display:flex;justify-content:space-between;color:#98a5b4;font-size:11px}.turn{margin-top:10px}.darts{display:flex;gap:7px;min-height:38px;flex-wrap:wrap;margin:9px 0}.chip{background:#293746;border-radius:999px;padding:8px 11px}.mult{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:7px}.mult .sel{outline:2px solid #61d7ff}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nums button{padding:13px 5px;font-weight:750}.actions{display:flex;gap:7px;margin-top:9px}.actions>*{flex:1}.primary{background:#61d7ff;color:#071118;font-weight:850}.danger{background:#48252b}.hide{display:none}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.kpi{background:#0f151d;border:1px solid #2a3745;border-radius:12px;padding:10px}.kpi b{display:block;font-size:23px}.cricket{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cricket div{background:#0f151d;border:1px solid #2a3745;border-radius:8px;padding:8px 2px;text-align:center}.mark{font-size:18px}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;color:#98a5b4;font-size:12px;margin:9px 0 4px}input,select{width:100%;background:#0d141c;color:#fff;border:1px solid #2a3745;border-radius:10px;padding:11px}.log{max-height:260px;overflow:auto}.log div{padding:7px 0;border-bottom:1px solid #24303d;font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e8f7ff;color:#071118;padding:10px 14px;border-radius:999px;font-weight:750;display:none;z-index:9}
@media(min-width:700px){.players{grid-template-columns:repeat(4,1fr)}.nums{grid-template-columns:repeat(10,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="app">
<div class="head"><div><div class="title">🎯 Darts Score</div><div class="muted">PWA — installable sur iPhone</div></div><button id="install" class="hide">＋ Installer</button></div>
<div class="tabs"><button class="active" data-tab="game">🎯 Partie</button><button data-tab="stats">📊 Stats</button><button data-tab="settings">⚙️ Réglages</button></div>
<section id="game">
<div class="card"><div class="row"><div><b id="mode">501</b><div class="muted" id="round"></div></div><div style="text-align:right"><b id="checkout"></b><div class="muted" id="target"></div></div></div></div>
<div class="players" id="players"></div>
<div class="card turn"><b>Tour de <span id="activeName"></span></b><div class="darts" id="darts"></div>
<div class="mult" id="mult"><button data-m="1" class="sel">S</button><button data-m="2">D</button><button data-m="3">T</button><button data-m="25">Bull</button><button data-m="0">Miss</button></div>
<div class="nums" id="nums"></div><div class="actions"><button class="primary" id="validate">Valider</button><button id="clear">Effacer</button></div></div>
<div class="card"><b>Historique</b><div class="log" id="log"></div></div>
</section>
<section id="stats" class="hide"><div class="card"><h3>Statistiques</h3><div class="kpis" id="kpis"></div><div id="statTable"></div></div></section>
<section id="settings" class="hide"><div class="card"><h3>Nouvelle partie</h3>
<label>Mode</label><select id="newMode"><option>301</option><option selected>501</option><option>701</option><option value="cricket">Cricket</option><option value="shanghai">Shanghai V</option></select>
<label>Joueurs — séparés par des virgules</label><input id="newNames" value="Joueur 1,Joueur 2">
<label>Sortie X01</label><select id="finish"><option value="double">Double Out</option><option value="single">Simple Out</option></select>
<div class="actions"><button class="primary" id="newGame">Nouvelle partie</button><button id="export">Exporter</button></div>
<p class="muted">Shanghai V : manches 1 à 5. Un Shanghai (simple + double + triple sur la cible) gagne immédiatement.</p></div>
</section></div><div id="toast" class="toast"></div>
<script src="app.js"></script></body></html>
